apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivebox-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hivebox
      component: worker
  template:
    metadata:
      labels:
        app: hivebox
        component: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: hivebox:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "main.py", "worker"]
          envFrom:
            - configMapRef:
                name: hivebox-config
            - secretRef:
                name: hivebox-secrets
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
