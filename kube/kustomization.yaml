apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deploy.yaml
  - ingress.yaml
  - minio.yaml
  - service.yaml
  - valkey.yaml
  - worker.yaml

# Development-only credentials. Replace this generator with your cloud secret
# manager before exposing HiveBox publicly.
secretGenerator:
  - name: hivebox-secrets
    literals:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - STORE_API_KEY=change-me-before-public

generatorOptions:
  disableNameSuffixHash: true
