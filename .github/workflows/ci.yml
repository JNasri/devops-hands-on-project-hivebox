name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# create test job (inside ubuntu machine in Github)
jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Local linting reminder
        run: |
          echo "Linting is handled locally in VS Code/SonarLint."
          echo "Skipping CI lint enforcement so PR checks focus on build and tests."

      - name: Scan Kubernetes manifests with Terrascan
        uses: tenable/terrascan-action@a4b0f7ec5fb3c4c66b8e76d824d958002f6ce12c
        with:
          iac_dir: kube
          iac_type: k8s
          only_warn: false

      - name: Build Docker image
        run: docker build -t hivebox:test .

      - name: Run unit tests
        # Run pytest with the -q option for quiet output
        run: pytest -q

      - name: Verify version endpoint
        run: |
          python -m flask --app main run --host 127.0.0.1 --port 5001 > /tmp/hivebox.log 2>&1 &
          for attempt in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:5001/version; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5001/version | grep -Fx "0.0.1"
