name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check main.py tests

      - name: Run unit tests
        run: pytest -q

      - name: Scan Kubernetes manifests with Terrascan
        uses: tenable/terrascan-action@a4b0f7ec5fb3c4c66b8e76d824d958002f6ce12c
        with:
          iac_dir: kube
          iac_type: k8s
          only_warn: false

      - name: Build Docker image
        run: docker build -t hivebox:test .

      - name: Smoke-test built image
        run: |
          docker run --detach --name hivebox-ci --publish 127.0.0.1:5001:5000 hivebox:test
          trap 'docker logs hivebox-ci; docker rm --force hivebox-ci' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:5001/healthz; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5001/version | grep --fixed-strings --line-regexp "1.0.0"
